[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "depcheck-mcp"
version = "0.2.0"
description = "A comprehensive MCP server for multi-ecosystem dependency intelligence — discovery, security, and management across PyPI, npm, Maven, and more."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Vincent Emonet", email = "vincent.emonet@gmail.com" },
]
keywords = ["mcp", "pypi", "python", "dependencies", "security", "package-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp>=1.27.0,<2.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "packaging>=24.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0",
    "uvicorn[standard]>=0.30.0",
    "starlette>=0.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
depcheck-mcp = "pypi_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pypi_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
